<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>시사경제용어사전</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 상단 앱바 ===== -->
<header class="appbar">
  <div class="appbar-row">
    <h1 class="appbar-title" id="appbarTitle">시사경제용어사전</h1>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="테마 전환">◐</button>
  </div>
</header>

<main id="main">

  <!-- ===== 1. 사전 ===== -->
  <section class="view is-active" id="view-dict" data-view="dict">
    <div class="sticky-tools">
      <div class="searchbar">
        <span class="searchbar-icon" aria-hidden="true">⌕</span>
        <input type="search" id="searchInput" placeholder="용어 또는 설명 검색" autocomplete="off">
        <button class="searchbar-clear" id="searchClear" type="button" aria-label="검색어 지우기">×</button>
      </div>

      <div class="chiprow" id="topicChips" role="group" aria-label="주제 필터"></div>

      <div class="toolrow">
        <div class="segmented" id="sortMode" role="group" aria-label="정렬 방식">
          <button type="button" class="seg is-active" data-sort="alpha">가나다·ABC순</button>
          <button type="button" class="seg" data-sort="topic">주제별</button>
          <button type="button" class="seg" data-sort="fav">즐겨찾기</button>
        </div>
        <span class="result-count" id="resultCount">0개</span>
      </div>

      <div class="indexrail" id="indexRail" aria-label="초성·알파벳 색인"></div>
    </div>

    <ul class="termlist" id="termList"></ul>
    <div class="list-sentinel" id="listSentinel"></div>
    <p class="empty" id="dictEmpty" hidden>데이터가 없습니다.</p>
  </section>

  <!-- ===== 2. 퀴즈 ===== -->
  <section class="view" id="view-quiz" data-view="quiz">

    <!-- 2-1 설정 화면 -->
    <div class="panel" id="quizSetup">
      <h2 class="panel-title">퀴즈 설정</h2>

      <div class="field">
        <label class="field-label">출제 범위</label>
        <div class="chiprow" id="quizScope" role="group">
          <button type="button" class="chip is-active" data-scope="all">전체</button>
          <button type="button" class="chip" data-scope="topic">주제 선택</button>
          <button type="button" class="chip" data-scope="fav">즐겨찾기</button>
          <button type="button" class="chip" data-scope="wrong">오답노트</button>
        </div>
      </div>

      <div class="field" id="quizTopicField" hidden>
        <label class="field-label">주제</label>
        <div class="chiprow" id="quizTopics" role="group"></div>
      </div>

      <div class="field">
        <label class="field-label">문제 유형</label>
        <div class="chiprow" id="quizType" role="group">
          <button type="button" class="chip is-active" data-type="def2term">설명 → 용어</button>
          <button type="button" class="chip" data-type="term2def">용어 → 설명</button>
          <button type="button" class="chip" data-type="mixed">혼합</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">문항 수</label>
        <div class="chiprow" id="quizCount" role="group">
          <button type="button" class="chip" data-count="5">5</button>
          <button type="button" class="chip is-active" data-count="10">10</button>
          <button type="button" class="chip" data-count="20">20</button>
          <button type="button" class="chip" data-count="30">30</button>
        </div>
      </div>

      <p class="hint" id="quizPoolHint"></p>
      <button class="btn btn-primary btn-block" id="quizStart" type="button">퀴즈 시작</button>
    </div>

    <!-- 2-2 진행 화면 -->
    <div class="panel" id="quizPlay" hidden>
      <div class="quiz-head">
        <div class="progress"><div class="progress-bar" id="quizProgress"></div></div>
        <div class="quiz-meta">
          <span id="quizStep">1 / 10</span>
          <span id="quizScore">정답 0</span>
          <button class="linkbtn" id="quizAbort" type="button">중단</button>
        </div>
      </div>

      <p class="quiz-prompt" id="quizPrompt"></p>
      <div class="quiz-question" id="quizQuestion"></div>
      <ul class="options" id="quizOptions"></ul>

      <div class="feedback" id="quizFeedback" hidden>
        <p class="feedback-title" id="feedbackTitle"></p>
        <p class="feedback-body" id="feedbackBody"></p>
      </div>
      <button class="btn btn-primary btn-block" id="quizNext" type="button" hidden>다음 문제</button>
    </div>

    <!-- 2-3 결과 화면 -->
    <div class="panel" id="quizResult" hidden>
      <h2 class="panel-title">결과</h2>
      <div class="score-card">
        <div class="score-big" id="resultScore">0%</div>
        <div class="score-sub" id="resultSub">0문항 중 0문항 정답</div>
      </div>
      <h3 class="sub-title" id="resultWrongTitle" hidden>틀린 문항</h3>
      <ul class="termlist" id="resultWrongList"></ul>
      <div class="btnrow">
        <button class="btn" id="resultAgain" type="button">같은 설정으로 다시</button>
        <button class="btn btn-primary" id="resultReviewWrong" type="button">틀린 문항만 복습</button>
      </div>
      <button class="btn btn-ghost btn-block" id="resultHome" type="button">설정으로 돌아가기</button>
    </div>
  </section>

  <!-- ===== 3. 오답노트 ===== -->
  <section class="view" id="view-review" data-view="review">
    <div class="panel">
      <h2 class="panel-title">오답노트</h2>
      <p class="hint">복습 퀴즈에서 <b id="masterNeed">2</b>회 연속 맞히면 삭제</p>
      <div class="btnrow">
        <button class="btn btn-primary" id="reviewStart" type="button">오답 복습 퀴즈</button>
        <button class="btn btn-ghost" id="reviewClear" type="button">전체 비우기</button>
      </div>
    </div>
    <ul class="termlist" id="reviewList"></ul>
    <p class="empty" id="reviewEmpty" hidden>데이터가 없습니다.</p>
  </section>

  <!-- ===== 4. 통계 ===== -->
  <section class="view" id="view-stats" data-view="stats">
    <div class="panel">
      <h2 class="panel-title">학습 통계</h2>
      <div class="statgrid" id="statGrid"></div>
    </div>
    <div class="panel">
      <h3 class="sub-title">주제별 정답률</h3>
      <div id="topicStats"></div>
    </div>
    <div class="panel">
      <h3 class="sub-title">데이터 관리</h3>
      <div class="btnrow">
        <button class="btn" id="exportBtn" type="button">학습기록 내보내기</button>
        <button class="btn btn-ghost" id="resetBtn" type="button">학습기록 초기화</button>
      </div>
      <p class="hint"></p>
    </div>
  </section>

</main>

<!-- ===== 상세 시트 ===== -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<aside class="sheet" id="detailSheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div>
      <span class="badge" id="detailTopic"></span>
      <h2 class="sheet-title" id="detailTerm"></h2>
    </div>
    <button class="icon-btn" id="detailFav" type="button" aria-label="즐겨찾기">☆</button>
  </div>
  <div class="sheet-body" id="detailDef"></div>
  <div class="sheet-foot">
    <button class="btn btn-ghost btn-block" id="detailClose" type="button">닫기</button>
  </div>
</aside>

<!-- ===== 하단 탭 ===== -->
<nav class="tabbar" id="tabbar">
  <button type="button" class="tab is-active" data-tab="dict"><span class="tab-ico">≡</span>사전</button>
  <button type="button" class="tab" data-tab="quiz"><span class="tab-ico">?</span>퀴즈</button>
  <button type="button" class="tab" data-tab="review"><span class="tab-ico">!</span>오답노트<span class="tab-badge" id="tabReviewBadge" hidden>0</span></button>
  <button type="button" class="tab" data-tab="stats"><span class="tab-ico">▤</span>통계</button>
</nav>

<div class="toast" id="toast" hidden></div>
<div class="loading" id="loading">데이터 불러오는 중…</div>

<script src="data/terms.js"></script>
<script src="js/storage.js"></script>
<script src="js/dictionary.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
